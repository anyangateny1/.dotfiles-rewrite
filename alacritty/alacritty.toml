[general]
live_config_reload = true
import = ["~/.config/alacritty/themes/themes/dracula_plus.toml"]

[env]
TERM = "alacritty"

[font]
size = 9.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[keyboard]

[[keyboard.bindings]]
  action = "ResetFontSize"
  key = "Key0"
  mods = "Command"

[[keyboard.bindings]]
  action = "IncreaseFontSize"
  key = "Equals"
  mods = "Command"

[[keyboard.bindings]]
  action = "DecreaseFontSize"
  key = "Minus"
  mods = "Command"

[window]
decorations = "None"
startup_mode = "Maximized"

[window.dimensions]
columns = 190
lines = 90
